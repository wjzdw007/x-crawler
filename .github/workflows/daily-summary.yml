name: Daily Summary Generator

on:
  # 定时任务 - 每天北京时间早上9点运行 (UTC+8 = 01:00 UTC)
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 01:00 (北京时间 09:00)

  # 手动触发
  workflow_dispatch:
    inputs:
      force_summary:
        description: '强制重新生成总结 (true/false)'
        required: false
        default: 'false'

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许推送代码
      issues: write        # 允许创建 Issue

    steps:
      # 1. 检出代码
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Python 环境
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安装 Python 依赖
      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 断言腾讯云 DeepSeek 密钥存在（缺失则直接失败，禁止走 mock）
      - name: 🔐 Assert Tencent DeepSeek secrets
        env:
          TENCENT_DEEPSEEK_API_KEY: ${{ secrets.TENCENT_DEEPSEEK_API_KEY }}
          LKEAP_API_KEY: ${{ secrets.LKEAP_API_KEY }}
        run: |
          if [ -z "${TENCENT_DEEPSEEK_API_KEY}" ] && [ -z "${LKEAP_API_KEY}" ]; then
            echo "::error::TENCENT_DEEPSEEK_API_KEY（或 LKEAP_API_KEY）未配置。Daily Summary 禁止以模拟内容绿过。"
            echo "请在 Settings → Secrets and variables → Actions 中写入腾讯云 DeepSeek / LKEAP API Key。"
            echo "文档: https://cloud.tencent.com/document/product/1772/115969"
            exit 1
          fi
          KEY_LEN=${#TENCENT_DEEPSEEK_API_KEY}
          if [ "$KEY_LEN" -eq 0 ]; then
            KEY_LEN=${#LKEAP_API_KEY}
          fi
          echo "Tencent DeepSeek API key is set (${KEY_LEN} chars)"

      # 5. 配置环境变量（不写入 OpenRouter）
      - name: ⚙️ Configure environment
        run: |
          cat > .env << EOF
          # 腾讯云 DeepSeek (LKEAP OpenAI 兼容接口)
          TENCENT_DEEPSEEK_API_KEY=${{ secrets.TENCENT_DEEPSEEK_API_KEY }}
          LKEAP_API_KEY=${{ secrets.LKEAP_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}

          # 代理配置 (可选)
          HTTP_PROXY=${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}

          # 数据目录
          DATA_DIR=crawler_data
          EOF

      # 6. 生成昨天的用户总结（失败则非零退出，不写 mock）
      - name: 🤖 Generate user summaries
        id: generate
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_summary }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "强制重新生成总结"
          fi

          echo "为昨天（Asia/Shanghai）的数据生成用户总结..."
          python run_crawler.py --user-summaries $FORCE_FLAG

      # 7. 生成运行报告
      - name: 📊 Generate report
        if: always()
        run: |
          echo "## 🤖 总结生成报告" > report.md
          echo "" >> report.md
          echo "- 🕐 运行时间: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S') (北京)" >> report.md
          echo "- 📝 任务类型: 生成昨天的用户总结" >> report.md
          echo "- 🧠 模型路径: 腾讯云 DeepSeek (LKEAP)" >> report.md
          echo "" >> report.md

          if [ -d "crawler_data/user_summaries" ]; then
            SUMMARY_COUNT=$(ls -1 crawler_data/user_summaries/*.md 2>/dev/null | wc -l)
            echo "- 📄 总结文件总数: $SUMMARY_COUNT 个" >> report.md

            DATA_DAY=$(TZ='Asia/Shanghai' date -d 'yesterday' +'%Y%m%d')
            DATA_DAY_COUNT=$(ls -1 crawler_data/user_summaries/*_${DATA_DAY}_*.md 2>/dev/null | wc -l)
            echo "- ✨ 数据日 ${DATA_DAY} 总结: $DATA_DAY_COUNT 个" >> report.md
          fi

          cat report.md

      # 8. 只暂存非 mock 的总结，再硬闸
      - name: 🚫 Reject mock summaries
        id: reject_mock
        if: always()
        run: |
          git add crawler_data/user_summaries/ || true

          if python scripts/check_summaries_not_mock.py --staged; then
            echo "staged summaries are real"
            exit 0
          fi

          echo "检测到模拟占位内容，将从暂存区移除这些文件"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from summarizer import is_mock_summary
          out = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--", "crawler_data/user_summaries/"],
              text=True,
          )
          bad = []
          for line in out.splitlines():
              path = Path(line)
              if path.is_file() and is_mock_summary(path.read_text(encoding="utf-8")):
                  bad.append(line)
          if bad:
              subprocess.check_call(["git", "reset", "HEAD", "--", *bad])
              print("unstaged:", *bad, sep="\n  ")
          PY
          exit 1

      # 9. 提交真实总结（部分成功也落库；job 仍会因 generate/reject 失败而标红）
      - name: 💾 Commit and push real summaries
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add crawler_data/user_summaries/

          python scripts/check_summaries_not_mock.py --staged

          if git diff --staged --quiet; then
            echo "没有真实总结需要提交"
          else
            git commit -m "🤖 总结更新: $(TZ='Asia/Shanghai' date +'%Y-%m-%d') 每日总结"
            git push
          fi

      # 10. 上传运行报告
      - name: 📤 Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-report-${{ github.run_number }}
          path: |
            report.md
            crawler_data/user_summaries/*.md
          retention-days: 30

      # 11. 失败通知
      - name: 🐛 Create Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Daily Summary Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## 总结生成失败报告

              **时间**: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}
              **工作流**: ${context.workflow}

              🔗 [查看运行日志](${context.payload.repository.html_url}/actions/runs/${context.runId})

              ### 可能原因
              - [ ] TENCENT_DEEPSEEK_API_KEY / LKEAP_API_KEY 未配置或无效
              - [ ] 腾讯云 DeepSeek 额度不足或模型下线
              - [ ] OPENAI_MODEL / OPENAI_BASE_URL 与 LKEAP 文档不一致
              - [ ] 昨天没有 users_daily 数据文件
              - [ ] 生成结果含模拟占位（已被拒绝提交）

              ---
              *此 Issue 由 GitHub Actions 自动创建*`,
              labels: ['bot', 'summary-failure']
            });

      # 12. Telegram 通知 (可选)
      - name: 📱 Send Telegram notification
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            MESSAGE="❌ *X Summary 生成失败*

            📅 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            🔗 [查看详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{
                \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
                \"text\": \"${MESSAGE}\",
                \"parse_mode\": \"Markdown\"
              }"
          fi
