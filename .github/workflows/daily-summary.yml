name: Daily Summary Generator

on:
  # 定时任务 - 每天北京时间早上9点运行 (UTC+8 = 01:00 UTC)
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 01:00 (北京时间 09:00)

  # 手动触发
  workflow_dispatch:
    inputs:
      force_summary:
        description: '强制重新生成总结 (true/false)'
        required: false
        default: 'false'

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许推送代码
      issues: write        # 允许创建 Issue

    steps:
      # 1. 检出代码
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Python 环境
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安装 Python 依赖
      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 配置环境变量
      - name: ⚙️ Configure environment
        run: |
          cat > .env << EOF
          # LLM配置 (总结需要)
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}

          # 代理配置 (可选)
          HTTP_PROXY=${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}

          # 数据目录
          DATA_DIR=crawler_data
          EOF

      # 5. 生成昨天的用户总结
      - name: 🤖 Generate user summaries
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_summary }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "强制重新生成总结"
          fi

          echo "为昨天的数据生成用户总结..."
          python run_crawler.py --user-summaries $FORCE_FLAG

      # 6. 生成运行报告
      - name: 📊 Generate report
        if: always()
        run: |
          echo "## 🤖 总结生成报告" > report.md
          echo "" >> report.md
          echo "- 🕐 运行时间: $(date +'%Y-%m-%d %H:%M:%S')" >> report.md
          echo "- 📝 任务类型: 生成昨天的用户总结" >> report.md
          echo "" >> report.md

          # 统计总结文件
          if [ -d "crawler_data/user_summaries" ]; then
            SUMMARY_COUNT=$(ls -1 crawler_data/user_summaries/*.md 2>/dev/null | wc -l)
            echo "- 📄 总结文件总数: $SUMMARY_COUNT 个" >> report.md

            # 统计今天生成的总结
            TODAY=$(date +'%Y%m%d')
            TODAY_SUMMARY_COUNT=$(ls -1 crawler_data/user_summaries/*_${TODAY}_*.md 2>/dev/null | wc -l)
            echo "- ✨ 今天生成: $TODAY_SUMMARY_COUNT 个" >> report.md
          fi

          cat report.md

      # 7. 提交总结到仓库
      - name: 💾 Commit and push summaries
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 只添加总结文件
          git add crawler_data/user_summaries/

          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "没有新总结需要提交"
          else
            git commit -m "🤖 总结更新: $(date +'%Y-%m-%d') 每日总结"
            git push
          fi

      # 8. 上传运行报告
      - name: 📤 Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-report-${{ github.run_number }}
          path: |
            report.md
            crawler_data/user_summaries/*.md
          retention-days: 30

      # 9. 失败通知
      - name: 🐛 Create Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Daily Summary Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## 总结生成失败报告

              **时间**: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}
              **工作流**: ${context.workflow}

              🔗 [查看运行日志](${context.payload.repository.html_url}/actions/runs/${context.runId})

              ### 可能原因
              - [ ] OpenRouter API 配额不足
              - [ ] LLM API 密钥过期
              - [ ] 昨天没有数据文件
              - [ ] 网络连接问题

              ---
              *此 Issue 由 GitHub Actions 自动创建*`,
              labels: ['bot', 'summary-failure']
            });

      # 10. Telegram 通知 (可选)
      - name: 📱 Send Telegram notification
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            MESSAGE="❌ *X Summary 生成失败*

            📅 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            🔗 [查看详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{
                \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
                \"text\": \"${MESSAGE}\",
                \"parse_mode\": \"Markdown\"
              }"
          fi
