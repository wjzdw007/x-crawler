name: Manual Summary Generator

# 仅手动触发 - 用于为历史数据生成总结
on:
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (格式: YYYYMMDD，留空表示昨天)'
        required: false
        default: ''
      force:
        description: '强制覆盖已有总结'
        required: false
        type: boolean
        default: false

jobs:
  generate-summaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Assert Tencent DeepSeek secrets
        env:
          TENCENT_DEEPSEEK_API_KEY: ${{ secrets.TENCENT_DEEPSEEK_API_KEY }}
          LKEAP_API_KEY: ${{ secrets.LKEAP_API_KEY }}
        run: |
          if [ -z "${TENCENT_DEEPSEEK_API_KEY}" ] && [ -z "${LKEAP_API_KEY}" ]; then
            echo "::error::TENCENT_DEEPSEEK_API_KEY（或 LKEAP_API_KEY）未配置。禁止以模拟内容绿过。"
            exit 1
          fi
          echo "Tencent DeepSeek API key is set"

      - name: ⚙️ Configure environment
        run: |
          cat > .env << EOF
          TENCENT_DEEPSEEK_API_KEY=${{ secrets.TENCENT_DEEPSEEK_API_KEY }}
          LKEAP_API_KEY=${{ secrets.LKEAP_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
          DATA_DIR=crawler_data
          EOF

      - name: 🤖 Generate summaries
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          if [ -z "${{ inputs.date }}" ]; then
            python run_crawler.py --user-summaries $FORCE_FLAG
          else
            python -c "
          from crawler import XCrawler
          crawler = XCrawler()
          crawler.generate_user_summaries_for_date('${{ inputs.date }}', force_overwrite=${{ inputs.force }})
            "
          fi

      - name: 🚫 Reject mock summaries
        run: |
          git add crawler_data/user_summaries/ || true
          python scripts/check_summaries_not_mock.py --staged

      - name: 💾 Commit summaries
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add crawler_data/user_summaries/

          if git diff --staged --quiet; then
            echo "没有新总结需要提交"
          else
            git commit -m "🤖 生成总结: ${{ inputs.date || '昨天' }}"
            git push
          fi
